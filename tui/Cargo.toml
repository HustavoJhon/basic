[package]
name = "basic"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Personal knowledge and learning system for the terminal"
license = "MIT"
repository = "https://github.com/HustavoJhon/basic"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
fuzzy-matcher = "0.3"
pulldown-cmark = "0.12"
ratatui = { version = "0.29", features = ["crossterm"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1"
tui-textarea = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
walkdir = "2"

[profile.release]
lto = "thin"
strip = "debuginfo"
